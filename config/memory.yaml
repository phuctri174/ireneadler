# Her long-term memory (core/irene/recall.py): what she keeps across restarts.
# Local only: a SQLite file in core/data/memory/ and an embedding model in core/models/.

enabled: true

# where the embedding model runs. cpu: no VRAM at all (a query takes ~10 ms).
# cuda: ~100 MB of VRAM, for a few ms less - the card has ~1 GB of headroom with
# gemma3, Whisper and the voice loaded, so cpu is the default.
device: cpu

# what one message may carry from memory, in tokens (gemma: ~3.5 characters a token).
# It is sent with that message only - never kept in the history - so it costs prefill
# on that message and never grows the KV cache over a session.
budget_tokens: 350          # an ordinary message: the few memories that bear on it
recall_budget_tokens: 600   # "what did we talk about last week": more, it is the answer

# how close in meaning an item must be to count (cosine, bge-small-en-v1.5). A shared
# rare word (a name) counts on its own.
min_similarity: 0.60

# expiry, in days per kind; 0 = kept until he asks her to forget it
keep_days:
  turn: 90        # an exchange: his words and her reply
  fact: 0         # something he told her about himself
  research: 365   # a question she looked up, and her answer
  lecture: 0      # a lecture's summary

# past this many items, the oldest exchanges go first
max_items: 20000
