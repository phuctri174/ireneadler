# The read-aloud voice corpus (core/irene/corpus.py; Ctrl+Alt+Shift+R in the HUD).
#
# Not subjects for her to learn: how HE speaks, across anything he might say to a
# general assistant. Each sentence is read three times, one file per take.
#
# split: test is the fixed held-out set (every 5th sentence, 20%): recorded like
# the rest, NEVER trained on - scripts/voice_wer.py measures word error rate on it.
# Lines tagged `sounds` deliberately work sounds that are hard for a Vietnamese
# speaker of English: final consonants, th, s/z endings, clusters, -ed endings,
# l/n and r/l.

sentences:
